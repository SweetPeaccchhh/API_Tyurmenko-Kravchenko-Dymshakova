# Calculator API — CI/CD Pipeline (версия GitHub Actions)

name: CI/CD Pipeline

# Определяем при каких событиях запускается пайплайн
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:      # чтобы можно было запустить вручную из UI

# Переменные окружения, доступные всем блокам работы
env:
  IMAGE_NAME: calculator-api
  REGISTRY: ghcr.io

jobs:
  # JOB 1: Проверка кода и тесты
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      # Забираем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'      # кэш pip для ускорения

      # устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # проверяем синтаксис кода
      - name: Lint with ruff
        run: |
          ruff check main.py

      # запускаем тесты
      - name: Run tests with pytest
        run: |
          pytest tests/ -v

  # JOB 2: Сборка и публикация Docker-образа
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test           # запускается, если тесты прошли
    if: github.event_name == 'push'    # только на push, не на пул-реквест

    # права для публикации в ghcr.io
    permissions:
      contents: read
      packages: write

    steps:
      # забираем код
      - name: Checkout repository
        uses: actions/checkout@v4

      # устанавливаем Buildx (расширенный docker build)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # логин в GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # генерируем теги образа
      # v1.0.<номер запуска>
      # всегда последняя версия
      # sha-<короткий sha> - уникальный тег по коммиту
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v1.0.${{ github.run_number }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # собраем и пушим образ
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # выводим список полученных тегов в лог
      - name: Show image tags
        run: |
          echo "Образ собран и опубликован с тегами:"
          echo "${{ steps.meta.outputs.tags }}"